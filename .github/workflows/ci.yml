name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    env:
      CLIPPULSE_TEST_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest boto3
      - name: Unit tests (memory store, fake table, and a real DynamoDB engine)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run build

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install cfn-lint pyyaml
      - run: python scripts/check_template.py template.yaml
      - run: cfn-lint template.yaml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install && npm run build
        working-directory: frontend
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start the demo server and drive the real UI
        run: |
          python backend/dev_server.py --port 8787 &
          sleep 3
          node scripts/e2e_check.js http://localhost:8787 .
