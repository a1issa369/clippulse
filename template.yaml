AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ClipPulse - finds rising Twitch clips for video editors. Lambda + HTTP API + DynamoDB + EventBridge, with an optional S3 + CloudFront front door.

Parameters:
  TwitchClientIdParam:
    Type: String
    Default: /clippulse/twitch_client_id
    Description: SSM parameter holding the Twitch client id (create it before deploying, see README).
  TwitchClientSecretParam:
    Type: String
    Default: /clippulse/twitch_client_secret
    Description: SSM SecureString parameter holding the Twitch client secret.
  PollSchedule:
    Type: String
    Default: rate(1 hour)
    Description: How often to snapshot view counts. Velocity needs at least two snapshots per clip.
  PinnedStreamers:
    Type: String
    Default: "rdcworld1,rdcgaming,kaicenat,xqc"
    Description: Comma-separated Twitch logins that are always tracked and never expire. Applied on the next hourly run (or invoke the poller by hand).
  MaxStreamers:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 50
    Description: How many visitor-added (temporary) streamers are tracked at once. With the pinned list, this is what caps Twitch API calls and DynamoDB writes.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. If set, AWS Budgets emails this address when the account passes 80 percent of the monthly budget.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "false" serves the website from the API Lambda (works on any account, nothing extra to verify).
      "true" adds S3 + CloudFront in front (needs a CloudFront-verified AWS account).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        TWITCH_CLIENT_ID_PARAM: !Ref TwitchClientIdParam
        TWITCH_CLIENT_SECRET_PARAM: !Ref TwitchClientSecretParam
        MAX_STREAMERS: !Ref MaxStreamers
        PINNED_STREAMERS: !Ref PinnedStreamers

Resources:
  # ---------------------------------------------------------------- data
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------- compute
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  PollerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 5

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: clippulse.api.handler
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref ApiLogs
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TwitchClientIdParam}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TwitchClientSecretParam}
      Events:
        AnyApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET

  PollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: clippulse.poller.handler
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref PollerLogs
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TwitchClientIdParam}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TwitchClientSecretParam}
      Events:
        Snapshot:
          Type: Schedule
          Properties:
            Schedule: !Ref PollSchedule

  # ---------------------------------------------------------------- website
  SiteBucket:
    Type: AWS::S3::Bucket
    Condition: UseCloudFront
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: UseCloudFront
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src https://clips.twitch.tv; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ClipPulse
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # managed: CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # managed: CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # managed: AllViewerExceptHostHeader

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFront
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------- cost guard
  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  SiteUrl:
    Description: Open this to use ClipPulse
    Value: !If
      - UseCloudFront
      - !Sub https://${Distribution.DomainName}
      - !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/
  SiteBucketName:
    Condition: UseCloudFront
    Value: !Ref SiteBucket
  DistributionId:
    Condition: UseCloudFront
    Value: !Ref Distribution
  TableName:
    Value: !Ref Table
  PollerFunctionName:
    Value: !Ref PollerFunction
  ApiFunctionName:
    Value: !Ref ApiFunction
